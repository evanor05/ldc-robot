# 独立规划实验参数，只含 map_server / planner_server / global_costmap。
# 日常完整导航由 navigation2.launch.py 加载 ldc_nav2.yaml；不要混用两组数值。
# 以下圆半径与膨胀参数是实验配置，尚未经实车包络和停车距离标定。
# inflation_radius 是软代价场范围；不是车体半径，也不是全范围禁止通行。

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""
    topic_name: "map"
    frame_id: "map"

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "ldc_navigation::ArenaPlanner"
      allow_unknown: false
      weight_cost: 0.5
      use_smoother: true
      max_expand: 200000

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      # 实验圆形近似，非实测；上车前使用已验证的车体几何。
      robot_radius: 0.09
      resolution: 0.05
      # 关键：让未知区在代价地图里保持 NO_INFORMATION，而不是被当成 free。
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          raytrace_max_range: 2.5
          raytrace_min_range: 0.0
          obstacle_max_range: 2.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 软代价场的实验值；本入口不运行 DWB。
        inflation_radius: 0.30
        cost_scaling_factor: 3.0
      always_send_full_costmap: true
  global_costmap_client:
    ros__parameters:
      use_sim_time: false
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: false
